name: Update HEARSAY submodule

# HEARSAY/ is a submodule of the team's NSA HEARSAY repository, which is developed there. This moves
# the pointer to that repository's latest main so the copy here stays current. Delete this file to
# pin HEARSAY/ at a fixed commit instead.
on:
  schedule:
    - cron: "17 */6 * * *"  # every six hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hearsay

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Move HEARSAY to its latest main
        run: |
          git submodule update --remote HEARSAY
          if git diff --quiet -- HEARSAY; then
            echo "HEARSAY is already at its latest main"
            exit 0
          fi
          sha=$(git -C HEARSAY rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARSAY
          git commit -m "Update HEARSAY submodule to $sha"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
