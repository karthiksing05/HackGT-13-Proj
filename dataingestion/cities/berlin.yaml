slug: berlin
name: Berlin
country_code: DE              # ISO 3166-1 alpha-2
default_region: BE            # Berlin is its own state (Land)
language: en                  # English place names and text
timezone: Europe/Berlin
currency: EUR                 # prices stored in local currency; no FX conversion
price_tiers: [0, 15, 40, 80]  # upper bounds for tiers 0-3; above the last = tier 4
center: { lat: 52.5200, lng: 13.4050 }                    # Mitte
bbox: { south: 52.37, west: 13.16, north: 52.67, east: 13.66 }   # ~33 x 34 km; clips outer Spandau / Müggelsee
hikes_radius_km: 40
elevation_dataset: eudem25m   # OpenTopoData; EU-DEM 25 m covers Germany
neighborhoods: [Mitte, Kreuzberg, Friedrichshain, Neukölln, Prenzlauer Berg, Schöneberg, Charlottenburg]
demo:                         # used by `blurb --top` and the acceptance checks
  start: { lat: null, lng: null }
  window_local: ["Sun 13:00", "Sun 17:00"]
query_terms:
  places: [rooftop bars, live music venues, board game cafe, escape room, things to do]
  events: [concerts, comedy, free events, art exhibitions, markets, nightlife, trivia night, workshops]
ticketmaster: { radius_km: 30 }
resident_advisor:                                    # §5.5; area_id verified 2026-09-26 via ra.co/graphql area(areaUrlName: "berlin", countryUrlCode: "de") -> id 34
  area_id: 34
  referer: https://ra.co/events/de/berlin
nps_park_codes: []
adapters:
  ticketmaster: true
  google_places: true         # needs billing (§5.2)
  osm_places: false
  serpapi_events: false
  web_calendar: false
  resident_advisor: true
  eventbrite: false
  osm_trails: true            # §5.10; Overpass + OpenTopoData, both free
  google_typical_time: false
  predicthq: false
  nps: false
  fsq_os: false
