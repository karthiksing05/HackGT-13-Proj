  history_museum: museum
  art_gallery: gallery
  performing_arts_theater: theater
  concert_hall: live_music
  opera_house: theater
  comedy_club: comedy
  tourist_attraction: landmark
  historical_landmark: landmark
  monument: landmark
  cultural_landmark: landmark
  observation_deck: viewpoint
  park: park
  city_park: park
  national_park: park
  state_park: park
  dog_park: park
  hiking_area: park
  botanical_garden: garden
  garden: garden
  zoo: zoo_aquarium
  aquarium: zoo_aquarium
  wildlife_park: zoo_aquarium
  bowling_alley: rec_venue
  amusement_center: rec_venue
  amusement_park: rec_venue
  video_arcade: rec_venue
  karaoke: rec_venue
  escape_room: rec_venue
  miniature_golf_course: rec_venue
  movie_theater: cinema
  bar: bar
  pub: bar
  wine_bar: bar
