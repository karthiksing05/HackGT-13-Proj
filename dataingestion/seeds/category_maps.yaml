# Source category -> our category (§4.3). Unmapped values fall back to "other"
# and are left for the LLM classifier (§6.3).

ticketmaster:
  # genre wins over segment when both map
  segment:
    Music: live_music
    Sports: sports_event
    Arts & Theatre: theater
    Film: cinema
  genre:
    Comedy: comedy
    Theatre: theater
    Musical: theater
    Dance: theater
    Opera: theater
    Classical: live_music
    Children's Theatre: theater
    Magic & Illusion: theater
    Circus & Specialty Acts: theater
    Spectacular: theater
    Ice Shows: theater
    Performance Art: theater
    Puppetry: theater
    Fine Art: gallery
    Fashion: community_event
    Multimedia: other
    Cultural: community_event
    Fairs & Festivals: festival
    Food & Drink: festival
    Community/Civic: community_event
    Community/Cultural: community_event
    Family: community_event
    Hobby/Special Interest Expos: community_event
    Lecture/Seminar: class_workshop
    Health/Wellness: class_workshop
    Casino/Gaming: rec_venue
    Miscellaneous: other

google:
