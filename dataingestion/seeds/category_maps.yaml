resident_advisor:
  # Genre slugs as RA returns them (genres[].slug). Most RA listings are DJ nights,
  # so anything unmapped is a nightclub; isFestival events become festival.
  default: nightclub
  # Slugs verified against ra.co/graphql `genres`. Only genres that usually mean a live band.
  genre:
    jazz: live_music
    classical: live_music
    krautrock: live_music
